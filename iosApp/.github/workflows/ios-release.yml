name: iOS Build for Sideloadly (unsigned .ipa)

on:
  push:
    tags: ["v*"]

jobs:
  build-ipa:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 (для Kotlin 2.2.10 / Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Install XcodeGen
        run: brew install xcodegen

      # Shared.framework собирает build-фаза Xcode (preBuildScript в project.yml):
      # :shared:embedAndSignAppleFrameworkForXcode
      - name: Generate Xcode project
        run: |
          cd iosApp
          xcodegen generate

      - name: Build unsigned .app for Sideloadly
        run: |
          cd iosApp
          xcodebuild -scheme iosApp -configuration Debug -sdk iphoneos \
            -derivedDataPath ./build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned .app into .ipa
        run: |
          set -euo pipefail
          cd iosApp

          PRODUCTS_DIR="./build/Build/Products/Debug-iphoneos"
          APP_PATH="$(find "${PRODUCTS_DIR}" -maxdepth 1 -type d -name "*.app" -print -quit)"
          if [ -z "${APP_PATH}" ]; then
            echo "::error::Не найден .app в ${PRODUCTS_DIR}"
            ls -la "${PRODUCTS_DIR}" || true
            exit 1
          fi
          echo "App bundle: ${APP_PATH}"

          rm -rf ./build/ipa-tmp oiltechunsigned.ipa
          mkdir -p ./build/ipa-tmp/Payload
          cp -R "${APP_PATH}" "./build/ipa-tmp/Payload/"

          # Архив создаётся относительно iosApp/, т.е. ровно там, откуда его забирает
          # actions/upload-artifact (см. path ниже). Раньше zip писал в build/.
          (cd ./build/ipa-tmp && zip -qry ../../oiltechunsigned.ipa Payload)

          ls -lh oiltechunsigned.ipa
          test -f oiltechunsigned.ipa

      - name: List build outputs
        run: |
          echo "Searching for IPA files..."
          find . -type f -name "*.ipa" -print
          echo "Searching for .app bundles..."
          find . -type d -name "*.app" -print

      - name: Upload unsigned .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: oiltech-ipa-sideloadly
          path: iosApp/oiltechunsigned.ipa
          if-no-files-found: error
