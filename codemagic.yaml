workflows:
  # Отладочная сборка без подписи: .app уходит в артефакты,
  # из него можно собрать .ipa для Sideloadly (см. README-IOS.md).
  ios-debug:
    name: iOS Debug Build (unsigned)
    max_build_duration: 60
    instance_type: mac_pro
    environment:
      xcode: latest
      # JDK 17 нужен Gradle (wrapper 9.x) и Kotlin 2.2:
      # Shared.framework собирается preBuild-фазой Xcode.
      java: 17
    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen || brew upgrade xcodegen || true
          xcodegen --version

      - name: Generate Xcode project
        script: |
          cd "$FCI_BUILD_DIR/iosApp"
          xcodegen generate

      # Shared.framework собирает preBuildScript из project.yml:
      # ./gradlew :shared:embedAndSignAppleFrameworkForXcode
      # -> shared/build/xcode-frameworks/<Configuration>/<SDK>/Shared.framework
      - name: Build iOS debug app (unsigned)
        script: |
          cd "$FCI_BUILD_DIR/iosApp"
          xcodebuild -project iosApp.xcodeproj -scheme iosApp \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ./build \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_ALLOWED=NO \
            build

      - name: Run shared unit tests (JVM)
        script: |
          cd "$FCI_BUILD_DIR"
          chmod +x ./gradlew
          ./gradlew :shared:jvmTest --no-configuration-cache

    artifacts:
      - iosApp/build/Build/Products/**/*.app
      - shared/build/reports/tests/**/*

    publishing:
      email:
        notify: false

  # Подписанная сборка .ipa. Требует настроенных сертификатов и профилей
  # в Codemagic (Settings -> Code signing identities) и платного Apple Developer.
  ios-ipa:
    name: iOS Release .ipa
    max_build_duration: 60
    instance_type: mac_pro
    environment:
      xcode: latest
      java: 17
      ios_signing:
        distribution_type: development
        bundle_identifier: ru.oiltechclean.assistant.iosApp
      vars:
        SCHEME: iosApp
    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen || brew upgrade xcodegen || true
          xcodegen --version

      - name: Generate Xcode project
        script: |
          cd "$FCI_BUILD_DIR/iosApp"
          xcodegen generate

      # Shared.framework собирает preBuildScript из project.yml.
      - name: Set up code signing
        script: |
          cd "$FCI_BUILD_DIR/iosApp"
          xcode-project use-profiles

      - name: Build .ipa
        script: |
          cd "$FCI_BUILD_DIR/iosApp"
          xcode-project build-ipa --project iosApp.xcodeproj --scheme "$SCHEME"

    artifacts:
      - iosApp/build/ios/ipa/*.ipa

    publishing:
      email:
        notify: false
